<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HourOne</title>
<meta name="description" content="HourOne: an alarm clock that gets you up, with wake-up checks, sunrise light, streaks and games.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Source+Serif+4:opsz,wght@8..60,400&display=swap">
<style>
:root{--bg:#f6f8fb;--fg:#1b2230;--muted:#5b6678;--rule:#dde3ec;--accent:#2f7fe0;--bell:#d88a1c}
@media (prefers-color-scheme: dark){:root{--bg:#0e1116;--fg:#e8edf4;--muted:#9aa6b8;--rule:#232a35;--accent:#5aa9ff;--bell:#ffb547;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Source Serif 4",Georgia,serif;font-size:17px;line-height:1.6}
main{max-width:36rem;margin:0 auto;padding:64px 20px 72px}
header{display:flex;align-items:center;gap:16px}
.ring{width:56px;height:56px;flex:none}
h1{font-family:"Poppins",system-ui,sans-serif;font-weight:700;font-size:2.2rem;margin:0}
.tag{color:var(--muted);margin:12px 0 32px}
nav{display:flex;flex-wrap:wrap;gap:12px}
nav a{font-family:"Poppins",system-ui,sans-serif;font-weight:600;font-size:.95rem;text-decoration:none;padding:12px 18px;border-radius:10px;border:1px solid var(--rule);color:var(--fg)}
nav a.primary{background:var(--accent);border-color:var(--accent);color:#fff}
nav a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
footer{margin-top:56px;padding-top:16px;border-top:1px solid var(--rule);color:var(--muted);font-size:.9rem}
</style>
</head>
<body>
<main>
  <header>
    <svg class="ring" viewBox="24 24 60 60" aria-hidden="true">
      <circle cx="54" cy="56" r="21.5" fill="none" stroke="var(--accent)" stroke-width="5"/>
      <path d="M51.5,42h5v15.2l9.2,5.4 -2.5,4.3L51.5,60z" fill="var(--fg)"/>
      <path d="M30,40l9,-8.5 3.4,3.6 -9,8.5zM78,40l-9,-8.5 -3.4,3.6 9,8.5z" fill="var(--bell)"/>
    </svg>
    <h1>HourOne</h1>
  </header>
  <p class="tag">An alarm clock that gets you up: wake-up checks, sunrise light, streaks and an arcade of games. For Android.</p>
  <nav>
    <a class="primary" href="https://play.google.com/store/apps/details?id=com.neomaverick.hourone">Get it on Google Play</a>
    <a href="privacy/">Privacy policy</a>
  </nav>
  <footer>HourOne · Malanoy</footer>
</main>
</body>
</html>
